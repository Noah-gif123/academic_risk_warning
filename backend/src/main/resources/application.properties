spring.application.name=academic_risk_warning

# 服务主端口（本地运行与接口测试）
server.port=8080

# MySQL（库名与 Navicat 中一致：study_warning_system）
spring.datasource.url=jdbc:mysql://localhost:3306/study_warning_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.mapper-locations=classpath:mapper/*.xml

# 登录 Token 有效期（小时）
auth.token-expire-hours=24

# ==================== 学业预警可配置参数 ====================

# 预警默认过期天数
warning.alert-expire-days=7

# 文件上传目录
warning.upload-dir=uploads/exercises/

# 文件上传大小限制（MB）
warning.max-file-size-mb=10

# 学习时长风险分段阈值（分钟）：[60, 120, 180, 240, 300]
# 低于第1档 → 100分，每提高一档降20分
warning.study-duration-thresholds=60,120,180,240,300

# 预测成绩调整系数
warning.homework-submit-adjust-factor=0.3
warning.attendance-adjust-factor=0.2

# 干预有效判定
warning.intervention-improve-threshold=-10.0
warning.intervention-low-risk-threshold=15.0

# 去重跳过时间窗口
warning.handled-skip-days=7
warning.closed-semester-months=6

# 催办与升级时间阈值（天）
warning.escalate-active-first-days=2
warning.escalate-active-second-days=5
warning.escalate-acked-days=3
warning.escalate-handled-first-days=3
warning.escalate-handled-upgrade-days=5

# ==================== MAS 多智能体配置 ====================

# 全局开关：是否启用 MAS 智能体
agent.enabled=true

# LLM 调用超时（秒）
agent.llm-timeout=120

# 单个智能体执行超时（秒）
agent.agent-timeout=60

# 百炼应用 API Key（请通过环境变量 BAILIAN_API_KEY 或替换此处为你的密钥）
agent.bailian-api-key=YOUR_API_KEY

# 百炼知识库应用 ID（默认，未匹配到课程时兜底使用）
agent.bailian-app-id=1aabcd737bb44364bd435642c22441e0

# 课程级知识库应用 ID 映射（courseId → appId）
# 每门课程在百炼平台创建独立知识库应用，实现课程级知识隔离检索
agent.bailian-app-ids.1=32de64721fd648c9a7bbc3a4968a2c5d
agent.bailian-app-ids.2=32a9a64ce40d4fdcbcf5bdce71e6b0bf

# 百炼 Chat 模型（qwen-plus / qwen-max / qwen-turbo）
agent.bailian-chat-model=qwen-plus

# 百炼 API 地址
agent.bailian-base-url=https://dashscope.aliyuncs.com

# RAG 召回数量
agent.rag-top-k=10

# RAG 相似度阈值
agent.rag-threshold=0.20

# ==================== 邮件通知配置 ====================
# 使用 QQ 邮箱或其他 SMTP 服务
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 邮件通知开关（true=同时发送站内+邮件，false=仅站内通知）
mail.enabled=false
mail.from-name=学业风险预警系统
mail.frontend-url=http://localhost:8080
