<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">选课记录操作</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { margin-top: 30px; }
        .card { max-width: 800px; margin: 0 auto; }
        .form-label { font-weight: 500; }
        .error-msg { color: #dc3545; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${title}"></h4>
        </div>
        <div class="card-body">
            <!-- 表单：提交到指定action -->
            <form th:action="${action}" method="post" th:object="${selection}">
                <!-- 学生编号 -->
                <div class="mb-3">
                    <label for="studentNo" class="form-label">学生编号 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="studentNo" name="studentNo"
                           th:field="*{studentNo}" required
                           th:readonly="${title == '修改选课记录'}"  <!-- 修改时学生编号只读（联合主键不可改） -->
                    placeholder="例如：S2023001">
                </div>

                <!-- 课程编号 -->
                <div class="mb-3">
                    <label for="courseNo" class="form-label">课程编号 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="courseNo" name="courseNo"
                           th:field="*{courseNo}" required
                           th:readonly="${title == '修改选课记录'}"  <!-- 修改时课程编号只读 -->
                    placeholder="例如：C001">
                </div>

                <!-- 学期编号 -->
                <div class="mb-3">
                    <label for="termNo" class="form-label">学期编号 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="termNo" name="termNo"
                           th:field="*{termNo}" required
                           th:readonly="${title == '修改选课记录'}"  <!-- 修改时学期编号只读 -->
                    placeholder="例如：202301（2023秋）、202302（2024春）">
                </div>

                <!-- 教学班编号 -->
                <div class="mb-3">
                    <label for="teachingClassNo" class="form-label">教学班编号 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="teachingClassNo" name="teachingClassNo"
                           th:field="*{teachingClassNo}" required
                           placeholder="例如：TC202301001">
                </div>

                <!-- 教师编号 -->
                <div class="mb-3">
                    <label for="teacherId" class="form-label">教师编号 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="teacherId" name="teacherId"
                           th:field="*{teacherId}" required
                           placeholder="例如：T001">
                </div>

                <!-- 错误提示（新增/修改失败时显示） -->
                <div class="error-msg" th:if="${param.error}">
                    操作失败！请检查必填字段是否完整。
                </div>

                <!-- 按钮组 -->
                <div class="d-flex justify-content-end gap-3 mt-4">
                    <a href="/courseSelections" class="btn btn-secondary">取消</a>
                    <button type="submit" class="btn btn-primary">提交</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
