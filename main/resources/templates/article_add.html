<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加文章</title>
    <!-- 引入Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2 class="mb-4">添加新文章</h2>
<!-- 文章上传表单 -->
<form class="needs-validation" action="/article/upload" method="post" enctype="multipart/form-data" novalidate>
    <!-- 文章标题 -->
    <div class="mb-4">
        <label for="title" class="form-label fw-bold">文章标题 <span class="text-danger">*</span></label>
        <div class="input-group">
            <input type="text" class="form-control" id="title" name="title"
                   placeholder="请输入文章标题（最多200个字符）" maxlength="200" required>
            <div class="invalid-feedback">请输入文章标题</div>
        </div>
    </div>

    <!-- 文章内容 -->
    <div class="mb-4">
        <label for="content" class="form-label fw-bold">文章内容 <span class="text-danger">*</span></label>
        <div class="input-group">
                <textarea class="form-control" id="content" name="content" rows="8"
                          placeholder="请输入文章内容" required></textarea>
            <div class="invalid-feedback">请输入文章内容</div>
        </div>
    </div>

    <!-- 标题图片 -->
    <div class="mb-4">
        <label for="titlePicFile" class="form-label fw-bold">标题图片</label>
        <div class="input-group">
            <input type="file" class="form-control" id="titlePicFile" name="titlePicFile"
                   accept="image/*">
        </div>
        <div class="form-text">支持JPG、PNG等图片格式</div>
    </div>

    <!-- 视频文件 -->
    <div class="mb-4">
        <label for="videoFile" class="form-label fw-bold">视频文件</label>
        <div class="input-group">
            <input type="file" class="form-control" id="videoFile" name="videoFile"
                   accept="video/*">
        </div>
        <div class="form-text">支持MP4、AVI等视频格式，最大100MB</div>
    </div>

    <!-- 操作按钮 -->
    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
        <button type="reset" class="btn btn-outline-secondary me-md-2">重置</button>
        <button type="submit" class="btn btn-primary">提交文章</button>
    </div>
</form>

<!-- 引入Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"></script>
<!-- 表单验证脚本 -->
<script>
    (function () {
        'use strict'
        var forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>
</body>
</html>
