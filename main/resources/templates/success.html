<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>课程列表</title>
</head>
<body>
<h1>课程列表</h1>
<form method="get" action="/courses/search" style="margin-bottom:12px;">
    <input type="text" name="courseNo" placeholder="按课程编号查询" />
    <button type="submit">查询</button>
    <a href="/courses/list">查看全部</a>
</form>
<table border="1" cellspacing="0" cellpadding="6">
    <thead>
    <tr>
        <th>ID</th>
        <th>课程编号</th>
        <th>课程名称</th>
        <th>院系编号</th>
        <th>院系名称</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${courses}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.courseNo}"></td>
        <td th:text="${c.courseName}"></td>
        <td th:text="${c.departId}"></td>
        <td th:text="${c.departName}"></td>
        <td>
            <a th:href="@{'/courses/edit/' + ${c.courseNo}}">编辑</a>
            <form method="post" action="/courses/delete" style="display:inline;margin-left:8px;">
                <input type="hidden" name="courseNo" th:value="${c.courseNo}" />
                <button type="submit">删除</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<a href="/courses/form">新增课程</a>
</body>
</html>
