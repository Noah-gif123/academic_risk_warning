<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章列表</title>
    <!-- 引入Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>文章列表</h2>
    <a href="/article/add" class="btn btn-success">添加文章</a>
</div>

<!-- 文章列表 -->
<div th:if="${pageInfo.list.size() > 0}">
    <div th:each="article : ${pageInfo.list}" class="mt-4 p-5 bg-light rounded shadow-sm">
        <h3 class="text-primary" th:text="${article.title}">文章标题</h3>
        <p class="mt-3" th:text="${article.content}">文章内容...</p>
        <!-- 标题图片 -->
        <div class="mt-3">
            <img th:if="${article.titlepic != null}" th:src="@{${article.titlepic}}"
                 alt="标题图片" style="width: 200px; height: auto; border-radius: 4px;">
            <span th:if="${article.titlepic == null}" class="text-muted">无标题图片</span>
        </div>
        <!-- 视频下载 -->
        <div class="mt-3">
            <a th:if="${article.video != null}"
               th:href="@{'/article/download?filename=' + ${article.video}}"
               class="btn btn-primary btn-sm">下载视频</a>
            <span th:if="${article.video == null}" class="text-muted">无视频文件</span>
        </div>
    </div>
</div>

<!-- 空列表提示 -->
<div th:if="${pageInfo.list.size() == 0}" class="mt-5 p-5 bg-light rounded text-center">
    <h4 class="text-muted">暂无文章数据，点击"添加文章"创建第一篇文章吧！</h4>
</div>

<!-- 分页组件 -->
<div th:replace="paging :: pageAdminNav(${pageInfo})" class="mt-5"></div>

<!-- 引入Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
