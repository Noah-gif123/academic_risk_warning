<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增课程</title>
</head>
<body>
<h1 th:text="${mode}=='edit' ? '修改课程' : '新增课程'"></h1>

<div th:if="${mode}!='edit'">
    <form method="post" action="/courses/form">
        <div>
            <label>课程编号</label>
            <input type="text" name="courseNo" th:value="${course.courseNo}" />
        </div>
        <div>
            <label>课程名称</label>
            <input type="text" name="courseName" th:value="${course.courseName}" />
        </div>
        <div>
            <label>院系编号</label>
            <input type="text" name="departId" th:value="${course.departId}" />
        </div>
        <div>
            <label>院系名称</label>
            <input type="text" name="departName" th:value="${course.departName}" />
        </div>
        <button type="submit">提交</button>
        <a href="/courses/list">查看列表</a>
    </form>
</div>

<div th:if="${mode}=='edit'">
    <form method="post" action="/courses/update">
        <div>
            <label>课程编号</label>
            <input type="text" name="courseNo" th:value="${course.courseNo}" readonly />
        </div>
        <div>
            <label>课程名称</label>
            <input type="text" name="courseName" th:value="${course.courseName}" />
        </div>
        <div>
            <label>院系编号</label>
            <input type="text" name="departId" th:value="${course.departId}" />
        </div>
        <div>
            <label>院系名称</label>
            <input type="text" name="departName" th:value="${course.departName}" />
        </div>
        <button type="submit">保存修改</button>
        <a href="/courses/list">返回列表</a>
    </form>

    <form method="post" action="/courses/delete" style="margin-top:12px;">
        <input type="hidden" name="courseNo" th:value="${course.courseNo}" />
        <button type="submit">删除该课程</button>
    </form>
</div>
</body>
</html>
