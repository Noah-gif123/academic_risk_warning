<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧选课系统 - 选课记录列表</title>
    <!-- 引入Bootstrap（简洁大方的UI框架） -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { margin-top: 30px; }
        .table th { text-align: center; }
        .table td { vertical-align: middle; text-align: center; }
        .btn-group { gap: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h2 class="text-center mb-4">智慧选课系统 - 选课记录管理</h2>

    <!-- 新增按钮 -->
    <a href="/courseSelections/add" class="btn btn-primary mb-3">
        <i class="bi bi-plus-circle"></i> 新增选课记录
    </a>

    <!-- 数据表格 -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>学生编号</th>
                    <th>课程编号</th>
                    <th>学期编号</th>
                    <th>教学班编号</th>
                    <th>教师编号</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <!-- Thymeleaf循环渲染数据 -->
                <tr th:each="item : ${selections}">
                    <td th:text="${item.studentNo}"></td>
                    <td th:text="${item.courseNo}"></td>
                    <td th:text="${item.termNo}"></td>
                    <td th:text="${item.teachingClassNo}"></td>
                    <td th:text="${item.teacherId}"></td>
                    <td>
                        <!-- 修改按钮（携带联合主键参数） -->
                        <a th:href="@{/courseSelections/edit(studentNo=${item.studentNo}, courseNo=${item.courseNo}, termNo=${item.termNo})}"
                           class="btn btn-sm btn-warning">修改</a>
                        <!-- 删除按钮（携带联合主键参数，添加确认提示） -->
                        <a th:href="@{/courseSelections/delete(studentNo=${item.studentNo}, courseNo=${item.courseNo}, termNo=${item.termNo})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('确定要删除该记录吗？')">删除</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 无数据提示 -->
    <div th:if="${selections.size() == 0}" class="text-center text-muted mt-5">
        暂无选课记录，请点击【新增选课记录】添加数据
    </div>
</div>

<!-- 引入Bootstrap图标和JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</body>
</html>
