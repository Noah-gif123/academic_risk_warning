server:
  port: 8080
  servlet:
    context-path: /springbootdemo
spring:
  profiles:
    active: dev
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
  servlet:
    multipart:
      # 照片墙上传：单张最大 10MB，单次请求最大 50MB
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    dispatch-options-request: true