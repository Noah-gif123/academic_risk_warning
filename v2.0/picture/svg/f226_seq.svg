<rect width="1250" height="640" fill="#ffffff"/><rect x="40" y="60" width="200" height="34" rx="4" fill="#eef4ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="140" y="81.86" font-size="13.5" text-anchor="middle" fill="#1a202c" font-family="Microsoft YaHei, Segoe UI, sans-serif">定时任务 / 教务触发</text><line x1="140" y1="94" x2="140" y2="540" stroke="#a0aec0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="320" y="60" width="160" height="34" rx="4" fill="#eef4ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="400" y="81.86" font-size="13.5" text-anchor="middle" fill="#1a202c" font-family="Microsoft YaHei, Segoe UI, sans-serif">规则引擎</text><line x1="400" y1="94" x2="400" y2="540" stroke="#a0aec0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="550" y="60" width="240" height="34" rx="4" fill="#eef4ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="670" y="81.86" font-size="13.5" text-anchor="middle" fill="#1a202c" font-family="Microsoft YaHei, Segoe UI, sans-serif">MySQL（考勤 / 分项 / 引擎配置）</text><line x1="670" y1="94" x2="670" y2="540" stroke="#a0aec0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="830" y="60" width="140" height="34" rx="4" fill="#eef4ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="900" y="81.86" font-size="13.5" text-anchor="middle" fill="#1a202c" font-family="Microsoft YaHei, Segoe UI, sans-serif">通知服务</text><line x1="900" y1="94" x2="900" y2="540" stroke="#a0aec0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="1050" y="60" width="160" height="34" rx="4" fill="#eef4ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="1130" y="81.86" font-size="13.5" text-anchor="middle" fill="#1a202c" font-family="Microsoft YaHei, Segoe UI, sans-serif">教师 / 辅导员</text><line x1="1130" y1="94" x2="1130" y2="540" stroke="#a0aec0" stroke-width="1.4" stroke-dasharray="6 5"/><path d="M143,130 L397,130" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/><text x="270" y="123" font-size="12.5" text-anchor="middle" fill="#2d3748" font-family="Microsoft YaHei, Segoe UI, sans-serif">触发评估（数据变更或手动）</text><path d="M403,176 L667,176" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/><text x="535" y="169" font-size="12.5" text-anchor="middle" fill="#2d3748" font-family="Microsoft YaHei, Segoe UI, sans-serif">读取考勤、分项得分、作业与引擎配置</text><path d="M400,222 h54 v26 h-54" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/><text x="462" y="238" font-size="12.5" text-anchor="start" fill="#1a202c" font-family="Microsoft YaHei, Segoe UI, sans-serif">通道判据 + 多源信号 + 三因子校正 + 置信度</text><path d="M403,268 L667,268" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/><text x="535" y="261" font-size="12.5" text-anchor="middle" fill="#2d3748" font-family="Microsoft YaHei, Segoe UI, sans-serif">写风险状态（一人一课一行，记录引擎版本）</text><path d="M403,314 L667,314" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/><text x="535" y="307" font-size="12.5" text-anchor="middle" fill="#2d3748" font-family="Microsoft YaHei, Segoe UI, sans-serif">达到阈值：生成预警 + 时间线</text><path d="M403,360 L897,360" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/><text x="650" y="353" font-size="12.5" text-anchor="middle" fill="#2d3748" font-family="Microsoft YaHei, Segoe UI, sans-serif">发出预警通知（按聚合键去重）</text><path d="M903,406 L1127,406" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1015" y="399" font-size="12.5" text-anchor="middle" fill="#2d3748" font-family="Microsoft YaHei, Segoe UI, sans-serif">站内信 / 邮件 + 回执</text><path d="M143,452 L897,452" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/><text x="520" y="445" font-size="12.5" text-anchor="middle" fill="#2d3748" font-family="Microsoft YaHei, Segoe UI, sans-serif">超时未处理：升级提醒（多科目 / 班集体）</text><path d="M903,498 L1127,498" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1015" y="491" font-size="12.5" text-anchor="middle" fill="#2d3748" font-family="Microsoft YaHei, Segoe UI, sans-serif">辅导员一次一条汇总提醒</text>
<text x="625" y="632" font-size="12.5" text-anchor="middle" fill="#718096" font-family="Microsoft YaHei, Segoe UI, sans-serif">注：同一学生多门课程的风险由定时任务聚合后再通知，避免一课一条、一班一条的打扰。</text></svg>