<path d="M60,458 L946,458 L960,472 L960,534 L60,534 Z" fill="#eef4ff" stroke="#2b6cb0" stroke-width="1.6"/><path d="M946,458 L946,472 L960,472" fill="none" stroke="#2b6cb0" stroke-width="1.2"/><text x="508" y="500.5" font-size="12.5" text-anchor="middle" fill="#744210" font-family="Microsoft YaHei, Segoe UI, sans-serif">说明：归档后如需更正，只能由教务操作并留痕，且不改变“归档”这一阶段标记；退课或误录的记录不物理删除，只标记为作废，保证统计口径可追溯。</text>
<text x="510" y="582" font-size="12.5" text-anchor="middle" fill="#718096" font-family="Microsoft YaHei, Segoe UI, sans-serif">注：一名学生一次课只有一条记录，阶段与来源由该记录的两个标记表达。</text></svg>