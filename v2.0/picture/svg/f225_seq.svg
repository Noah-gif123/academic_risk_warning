    <marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#4a5568"/></marker>
    <marker id="open" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L11,6 L0,12" fill="none" stroke="#4a5568" stroke-width="1.6"/></marker>
    <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#fff" stroke="#4a5568" stroke-width="1.4"/></marker>
  </defs>
<rect width="1060" height="560" fill="#ffffff"/><rect x="65" y="60" width="170" height="34" rx="4" fill="#eef4ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="150" y="81.86" font-size="13.5" text-anchor="middle" fill="#1a202c" font-family="Microsoft YaHei, Segoe UI, sans-serif">任课教师</text><line x1="150" y1="94" x2="150" y2="470" stroke="#a0aec0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="320" y="60" width="200" height="34" rx="4" fill="#eef4ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="420" y="81.86" font-size="13.5" text-anchor="middle" fill="#1a202c" font-family="Microsoft YaHei, Segoe UI, sans-serif">考勤与扣分服务</text><line x1="420" y1="94" x2="420" y2="470" stroke="#a0aec0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="585" y="60" width="230" height="34" rx="4" fill="#eef4ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="700" y="81.86" font-size="13.5" text-anchor="middle" fill="#1a202c" font-family="Microsoft YaHei, Segoe UI, sans-serif">考勤 / 留痕 / 风险状态</text><line x1="700" y1="94" x2="700" y2="470" stroke="#a0aec0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="865" y="60" width="150" height="34" rx="4" fill="#eef4ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="940" y="81.86" font-size="13.5" text-anchor="middle" fill="#1a202c" font-family="Microsoft YaHei, Segoe UI, sans-serif">学生端</text><line x1="940" y1="94" x2="940" y2="470" stroke="#a0aec0" stroke-width="1.4" stroke-dasharray="6 5"/><path d="M153,130 L417,130" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/><text x="285" y="123" font-size="12.5" text-anchor="middle" fill="#2d3748" font-family="Microsoft YaHei, Segoe UI, sans-serif">打开点名单（课表定位第 W 周第 S 次课）</text><path d="M417,176 L153,176" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="285" y="169" font-size="12.5" text-anchor="middle" fill="#2d3748" font-family="Microsoft YaHei, Segoe UI, sans-serif">返回全班默认出勤名单</text><path d="M153,222 L417,222" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/><text x="285" y="215" font-size="12.5" text-anchor="middle" fill="#2d3748" font-family="Microsoft YaHei, Segoe UI, sans-serif">提交异常学生状态（缺课 / 迟到 / 请假）</text><path d="M423,268 L697,268" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/><text x="560" y="261" font-size="12.5" text-anchor="middle" fill="#2d3748" font-family="Microsoft YaHei, Segoe UI, sans-serif">写入考勤记录（阶段＝平时，来源＝教师）</text><path d="M423,304 L697,304" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/><text x="560" y="297" font-size="12.5" text-anchor="middle" fill="#2d3748" font-family="Microsoft YaHei, Segoe UI, sans-serif">写行级改动留痕</text><path d="M703,350 L937,350" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/><text x="820" y="343" font-size="12.5" text-anchor="middle" fill="#2d3748" font-family="Microsoft YaHei, Segoe UI, sans-serif">学生端即时可见本人出勤明细</text><path d="M703,396 L937,396" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="820" y="389" font-size="12.5" text-anchor="middle" fill="#2d3748" font-family="Microsoft YaHei, Segoe UI, sans-serif">更新缺课 / 迟到 / 请假次数与扣分、预警等级</text>
<text x="530" y="552" font-size="12.5" text-anchor="middle" fill="#718096" font-family="Microsoft YaHei, Segoe UI, sans-serif">注：录入即学生可见，不经过教务；归档与平时冲突时以归档为准。</text></svg>