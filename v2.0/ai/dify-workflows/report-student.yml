app:
  description: 学生端学习评价报告：事实包进、四段正文出；数字由后端回验
  icon: 📊
  icon_background: '#E0F2FE'
  mode: workflow
  name: 学习评价报告（学生端）
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-to-llm
      source: 'start_node'
      sourceHandle: source
      target: 'llm_node'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: llm-to-end
      source: 'llm_node'
      sourceHandle: source
      target: 'end_node'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 后端 FactPackBuilder 生成的事实文本
        selected: false
        title: 开始
        type: start
        variables:
        - label: facts
          max_length: 4000
          options: []
          required: true
          type: paragraph
          variable: facts
        - label: course
          max_length: 100
          options: []
          required: false
          type: text-input
          variable: course
        - label: student
          max_length: 50
          options: []
          required: false
          type: text-input
          variable: student
        - label: risk_level
          max_length: 20
          options: []
          required: false
          type: text-input
          variable: risk_level
        - label: total_score
          max_length: 10
          options: []
          required: false
          type: text-input
          variable: total_score
        - label: class_avg
          max_length: 10
          options: []
          required: false
          type: text-input
          variable: class_avg
        - label: absents
          max_length: 10
          options: []
          required: false
          type: text-input
          variable: absents
        - label: allowed_absents
          max_length: 10
          options: []
          required: false
          type: text-input
          variable: allowed_absents
      height: 90
      id: 'start_node'
      position:
        x: 30
        y: 227
      positionAbsolute:
        x: 30
        y: 227
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 只做"把事实写成人话"，不做任何计算
        title: 写报告
        type: llm
        model:
          provider: langgenius/deepseek/deepseek
          name: deepseek-v4-flash
          mode: chat
          completion_params:
            temperature: 0.5
            max_tokens: 1600
        prompt_template:
          - role: system
            text: |
              你是高校学业预警系统里的「学习评价撰写助手」，服务对象是学生本人。
              必须遵守：
              1. 只能使用用户给出的数字，禁止自己计算、换算或编造任何数字、比例、排名；
              2. 严格输出四段，段落标题只能是【结论】【你的强项】【需要补的地方】【下一步做什么】，每段 1-3 句，四个标题各自独占一行；
              3. 用第二人称，语气平实，不出现"挂科""必挂""肯定过不了"等判定词，风险结论只能引用给定的预警等级；
              4. 不使用 Markdown 星号、表格、代码块；前两段只挑最关键的 3 到 5 个数字，不要罗列；
              5. 总字数 350 到 600 字，最后一段给出可以直接执行的动作；
              6. 最后一段允许给出训练时长、题量这类计划数字（如"每天 5 道题、限时 8 分钟"）；
              7. 直接输出报告正文，不要输出思考过程、不要复述这些规则。
          - role: user
            text: |
              以下是这名学生的真实数据（由系统计算，不得改动）：
              {{#start_node.facts#}}

              请据此写一份学习评价报告：先给结论（结合预警等级），再说强项与最需要补的 2 到 3 块，最后给出 3 条可以直接执行的动作。
        vision:
          enabled: false
          configs:
            variable_selector: []
        memory:
          enabled: false
          window:
            enabled: false
            size: 50
        context:
          enabled: false
          variable_selector: []
        structured_output:
          enabled: false
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 1000
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 10000
      height: 90
      id: 'llm_node'
      position:
        x: 334
        y: 227
      positionAbsolute:
        x: 334
        y: 227
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 后端读取 outputs.text
        outputs:
        - value_selector:
          - 'llm_node'
          - text
          value_type: string
          variable: text
        selected: false
        title: 结束
        type: end
      height: 90
      id: 'end_node'
      position:
        x: 638
        y: 227
      positionAbsolute:
        x: 638
        y: 227
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
