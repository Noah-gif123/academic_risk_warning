server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: academic-risk-warning
  # 让「IDEA 直接 Run」也能读到密钥：把 ai.env（git 忽略、不入库）当 properties 导入。
  # 三个候选路径覆盖不同工作目录（IDEA 默认 $MODULE_WORKING_DIR$ 或项目根），都不存在时不报错。
  # ai.env 是 KEY=VALUE 格式，天然符合 properties 语法；[.properties] 是扩展名提示——
  # 没有它 Spring 不认识 .env 这种后缀，会当成"无法解析"直接跳过（踩过这个坑）。
  config:
    import:
      - optional:file:./ai.env[.properties]
      - optional:file:./backend/ai.env[.properties]
      - optional:file:./v2.0/backend/ai.env[.properties]
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/study_warning_system_v2?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  auth:
    # 令牌有效期（小时）
    token-expire-hours: 12
    # 登录图形验证码（联调可关）
    captcha-enabled: true
    # 验证码调试接口（默认关闭，仅本机联调时临时打开）
    captcha-debug: false
  alert:
    # 通知总开关：批量重算（换口径/重建数据）时设 false，预警记录照常生成但不外发消息
    notify-enabled: ${ALERT_NOTIFY_ENABLED:true}
  bootstrap:
    # 首次启动时为档案建统一账号（幂等，可关掉）
    enabled: true
    default-password: "000000"
  file:
    # 课程资料文件的落盘目录（相对启动目录），库里只存元信息
    store-dir: ./file-store

ai:
  # 第三阶段 AI 总开关：false 时所有 AI 入口回退模板，不调用 Dify
  enabled: ${AI_ENABLED:true}
  # Dify 自托管地址（默认 8090，避开 80/443，与现有 8080/5173/3306 不冲突）
  base-url: ${AI_DIFY_BASE_URL:http://localhost:8090}
  # 学习评价报告工作流的 App API Key（在 Dify 控制台创建应用后复制到这里）
  report-app-key: ${AI_REPORT_APP_KEY:}
  # ---- RAG 混合检索（R2）：全文(MySQL ngram) + 向量(Dify 知识库) + RRF 融合 ----
  retrieval:
    # FULLTEXT / VECTOR / HYBRID；知识库 key 没配时 HYBRID 会自动降级为 FULLTEXT
    mode: ${AI_RAG_MODE:HYBRID}
    # 每路召回池大小（融合前），最终给模型的条数由调用方决定
    pool-size: 20
    vector-top-k: 20
    # Dify 知识库 API Key 与知识库 ID（控制台「知识库 → API」创建；不是应用 App Key）
    dataset-key: ${AI_RAG_DATASET_KEY:}
    dataset-id: ${AI_RAG_DATASET_ID:}
    # 按 metadata.course_id 过滤，避免跨课程串答案
    filter-by-course: true
    # 同一份文档最多占几个结果名额（抑制同源分块占满 top-k）
    max-per-doc: 2
    # 词面支撑度下限：取 top-k 最大值后，HYBRID 下 0.25 是拐点（拒答 0.90 / 误拒 9.3%，见 ai/rag-eval.md）
    min-lex-support: ${AI_RAG_MIN_LEX:0.25}
  # AI 出题工作流的 App API Key（M2 使用）
  question-app-key: ${AI_QUESTION_APP_KEY:}
  # 预警解释卡工作流 App Key（M9 使用）
  alert-explain-app-key: ${AI_ALERT_APP_KEY:}
  # 群体报告（教学班 / 行政班）工作流 App Key（M8 使用）
  group-report-app-key: ${AI_GROUP_REPORT_APP_KEY:}
  # 课程问答 App API Key（M4 使用）
  chat-app-key: ${AI_CHAT_APP_KEY:}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:120}
  # 每个用户每日调用上限（防跑飞）；演示/答辩那天可以用 AI_DAILY_LIMIT=0 关掉上限
  daily-limit: ${AI_DAILY_LIMIT:30}
  # 仅用于记录/占位；真实通道的模型名由 AiRunService.modelLabel 按 source 决定
  model: qwen-plus
  # 计费估算：元 / 千 token
  yuan-per-k-token: 0.0015
  report-prompt-version: report-student-v1
  # 通用直连通道（任意 OpenAI 兼容端点，Dify 不可用时兜底）
  # 例：DashScope  -> https://dashscope.aliyuncs.com/compatible-mode/v1 + qwen-plus
  #     DeepSeek   -> https://api.deepseek.com/v1 + deepseek-chat
  llm-base-url: ${AI_LLM_BASE_URL:}
  llm-api-key: ${AI_LLM_KEY:}
  llm-model: ${AI_LLM_MODEL:}
  # 兼容旧配置：上面三项留空时用这里的 dashscope-*
  dashscope-key: ${AI_DASHSCOPE_KEY:}
  dashscope-base-url: ${AI_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  dashscope-model: ${AI_DASHSCOPE_MODEL:qwen-plus}

logging:
  level:
    root: info
    com.example.academic_risk_warning: debug
