# =============================================================================
# 学情预警系统 v2.0 · 应用栈（后端 + 前端）
#   与 Dify（v2.0/ai/dify）分开编排：本文件只负责我们自己的两个服务
#   依赖：宿主 MySQL(3306) 与 Dify(8090)，容器内通过 host.docker.internal 访问
#
#   用法：
#     cd v2.0
#     docker compose -f docker-compose.app.yml build
#     docker compose -f docker-compose.app.yml up -d
#     docker compose -f docker-compose.app.yml ps
#     curl http://localhost:8080/api/ai/health      # 后端健康检查
#     http://localhost:8081                          # 前端（nginx 托管 dist）
# =============================================================================

name: arw-app

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 固定标签（语义版本），不用 latest；回滚即改回上一个版本号
    image: academic-risk-warning-backend:2.0.0
    container_name: arw-app
    ports:
      - "8080:8080"
    environment:
      # 数据库：容器内不能写 localhost，用 host.docker.internal 指向宿主 MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/study_warning_system_v2?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      # Dify：同一台宿主机上的 8090
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_DIFY_BASE_URL: http://host.docker.internal:8090
      AI_REPORT_APP_KEY: ${AI_REPORT_APP_KEY:-}
      AI_GROUP_REPORT_APP_KEY: ${AI_GROUP_REPORT_APP_KEY:-}
      AI_ALERT_APP_KEY: ${AI_ALERT_APP_KEY:-}
      # 直连模型通道（DeepSeek / 任意 OpenAI 兼容端点），密钥只走环境变量
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-https://api.deepseek.com/v1}
      AI_LLM_KEY: ${AI_LLM_KEY:-}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-deepseek-chat}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
      TZ: Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 资源限制：避免单个容器吃满宿主内存
    mem_limit: 1g
    restart: unless-stopped
    depends_on: {}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/ai/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # 上传资料落命名卷：容器重建不丢文件
    volumes:
      - app-file-store:/app/file-store
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - app-net

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: academic-risk-warning-frontend:2.0.0
    container_name: arw-web
    ports:
      - "8081:80"
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"
    networks:
      - app-net

volumes:
  app-file-store:
    name: arw-app-file-store

networks:
  app-net:
    name: arw-app-net
    driver: bridge
