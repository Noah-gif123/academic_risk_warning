name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: backend-compile-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2.0/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Compile and unit tests
        run: ./gradlew --no-daemon clean test

  frontend:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2.0/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  p1-integration:
    name: p1-integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.30
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: study_warning_system_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/study_warning_system_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: root
      AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Import fixed demo snapshot
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "DROP DATABASE IF EXISTS study_warning_system_demo; CREATE DATABASE study_warning_system_demo DEFAULT CHARACTER SET utf8mb4;"
          mysql -h127.0.0.1 -uroot -proot study_warning_system_demo < v3.0/sql/snapshot_demo.sql
      - name: Start backend
        working-directory: v2.0/backend
        run: |
          chmod +x gradlew
          nohup ./gradlew --no-daemon bootRun --args='--server.port=18101 --app.auth.captcha-debug=true' > /tmp/backend.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18101/api/ai/health >/dev/null; then break; fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:18101/api/ai/health >/dev/null; then
            cat /tmp/backend.log
            exit 1
          fi
      - name: Run P1 acceptance
        run: node v3.0/tool/verify_p1.mjs
